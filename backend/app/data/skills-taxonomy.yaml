  ownership:
    related_skills: ["PROG", "TMLP", "PRMG", "ARCH"]
    description: "Leaders are owners who act on behalf of the entire company"
    
  invent_and_simplify:
    related_skills: ["ARCH", "SYSD", "MLEA", "DEEP"]
    description: "Leaders expect and require innovation and invention from their teams"
    
  are_right_a_lot:
    related_skills: ["DAAN", "STAT", "ARCH", "TMLP"]
    description: "Leaders are right a lot and have strong business judgment"
    
  learn_and_be_curious:
    related_skills: ["ALL"]
    description: "Leaders are never done learning and always seek to improve themselves"
    
  hire_and_develop_the_best:
    related_skills: ["TMLP", "PELP", "PRMG"]
